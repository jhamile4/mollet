name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build y pruebas (unitarias + integración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify = compila + pruebas unitarias (surefire) + integración con Testcontainers (failsafe).
      # Los runners de GitHub ya traen Docker, así que Testcontainers levanta PostgreSQL solo.
      - name: Build y pruebas
        run: ./mvnw -B verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t mollet:${{ github.sha }} .
