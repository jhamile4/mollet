# Perfil de desarrollo local. Usa la base de datos de docker-compose.yml.
# Estos valores SOLO sirven en tu máquina; en producción todo viene de variables de entorno.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mollet}
    username: ${DATABASE_USERNAME:mollet}
    password: ${DATABASE_PASSWORD:mollet}
  jpa:
    show-sql: false

mollet:
  jwt:
    # Clave de desarrollo (pública a propósito). Nunca se usa en producción:
    # el perfil prod exige JWT_SECRET y no tiene valor por defecto.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
  admin:
    email: ${ADMIN_EMAIL:admin@mollet.dev}
    password: ${ADMIN_PASSWORD:Admin12345}

logging:
  level:
    com.mollet: DEBUG
